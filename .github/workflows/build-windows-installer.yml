name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          foreach ($script in @('installer/windows/install_windows.ps1', 'installer/windows/build.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $script), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Host "$script`: $($_.Message) ($($_.Extent.StartLineNumber))" }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Compile installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" .\installer\windows\setup_POS_nuvi.iss'
      - name: Test missing XAMPP preflight
        shell: pwsh
        run: |
          if (Test-Path 'C:\xampp') {
            throw 'El runner ya contiene C:\xampp; la prueba no modificará una instalación existente.'
          }
          $setup = Start-Process -FilePath (Join-Path $PWD 'dist\setup_POS_nuvi.exe') `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -PassThru
          if (!$setup.WaitForExit(30000)) {
            Stop-Process -Id $setup.Id -Force
            throw 'El instalador no terminó la comprobación en 30 segundos.'
          }
          if ($setup.ExitCode -eq 0) { throw 'El instalador aceptó un equipo sin XAMPP.' }
          if (Test-Path 'C:\xampp') { throw 'El instalador creó archivos antes de validar XAMPP.' }
      - name: Test existing installation protection
        shell: pwsh
        run: |
          if (Test-Path 'C:\xampp') {
            throw 'El runner ya contiene C:\xampp; la prueba no modificará una instalación existente.'
          }
          New-Item -ItemType Directory -Force 'C:\xampp\php', 'C:\xampp\mysql\bin', 'C:\xampp\htdocs\tienda-nuvi' | Out-Null
          New-Item -ItemType File 'C:\xampp\php\php.exe', 'C:\xampp\mysql\bin\mysql.exe' | Out-Null
          Set-Content 'C:\xampp\htdocs\tienda-nuvi\no-sobrescribir.txt' 'dato de prueba'
          $log = Join-Path $env:RUNNER_TEMP 'nuvi-existing-test.log'
          $setup = Start-Process -FilePath (Join-Path $PWD 'dist\setup_POS_nuvi.exe') `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$log" -PassThru
          if (!$setup.WaitForExit(30000)) {
            Stop-Process -Id $setup.Id -Force
            throw 'El instalador no terminó la comprobación en 30 segundos.'
          }
          if ($setup.ExitCode -eq 0) { throw 'El instalador aceptó una carpeta con archivos.' }
          if (!(Select-String -Path $log -SimpleMatch 'La carpeta destino contiene archivos' -Quiet)) {
            Get-Content $log | Write-Host
            throw 'El rechazo no ocurrió por la protección de archivos existentes.'
          }
          if ((Get-Content 'C:\xampp\htdocs\tienda-nuvi\no-sobrescribir.txt' -Raw).Trim() -ne 'dato de prueba') {
            throw 'El instalador modificó el archivo existente.'
          }
          if ((Get-ChildItem 'C:\xampp\htdocs\tienda-nuvi' -Force).Count -ne 1) {
            throw 'El instalador copió archivos sobre la carpeta existente.'
          }
      - name: Test configuration failure is reported
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'nuvi-installer-fixture'
          New-Item -ItemType Directory -Path $fixture | Out-Null
          git archive HEAD | tar -xf - -C $fixture
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo preparar el paquete de prueba.' }
          Set-Content -Path (Join-Path $fixture 'installer\windows\install_windows.ps1') -Value 'exit 37'
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" (Join-Path $fixture 'installer\windows\setup_POS_nuvi.iss')
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo compilar el paquete de prueba.' }
          Remove-Item 'C:\xampp\htdocs\tienda-nuvi\no-sobrescribir.txt'
          $log = Join-Path $env:RUNNER_TEMP 'nuvi-failure-test.log'
          $setup = Start-Process -FilePath (Join-Path $fixture 'dist\setup_POS_nuvi.exe') `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$log" -PassThru
          if (!$setup.WaitForExit(30000)) {
            Stop-Process -Id $setup.Id -Force
            throw 'El instalador no informó el fallo de configuración en 30 segundos.'
          }
          if ($setup.ExitCode -eq 0) { throw 'La configuración falló, pero el instalador informó éxito.' }
          if (!(Select-String -Path $log -SimpleMatch 'La configuracion fallo (codigo 37)' -Quiet)) {
            Get-Content $log | Write-Host
            throw 'El instalador no identificó el fallo de configuración en el registro.'
          }
      - name: Test successful installer control flow
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'nuvi-installer-fixture'
          Move-Item 'C:\xampp\htdocs\tienda-nuvi' 'C:\xampp\htdocs\tienda-nuvi-fallido-prueba'
          Set-Content -Path (Join-Path $fixture 'installer\windows\install_windows.ps1') -Value 'exit 0'
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" (Join-Path $fixture 'installer\windows\setup_POS_nuvi.iss')
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo compilar el paquete de prueba.' }
          $setup = Start-Process -FilePath (Join-Path $fixture 'dist\setup_POS_nuvi.exe') `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -PassThru
          if (!$setup.WaitForExit(30000)) {
            Stop-Process -Id $setup.Id -Force
            throw 'El instalador no terminó la prueba en 30 segundos.'
          }
          if ($setup.ExitCode -ne 0 -or !(Test-Path 'C:\xampp\htdocs\tienda-nuvi\login.php')) {
            throw 'El flujo de instalación con configurador simulado no terminó correctamente.'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: setup_POS_nuvi
          path: dist/setup_POS_nuvi.exe
      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/setup_POS_nuvi.exe