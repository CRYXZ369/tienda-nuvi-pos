name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          foreach ($script in @('installer/windows/install_windows.ps1', 'installer/windows/build.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $script), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Host "$script`: $($_.Message) ($($_.Extent.StartLineNumber))" }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Compile installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" .\installer\windows\setup_POS_nuvi.iss'
      - name: Test missing XAMPP preflight
        shell: pwsh
        run: |
          if (Test-Path 'C:\xampp') {
            throw 'El runner ya contiene C:\xampp; la prueba no modificará una instalación existente.'
          }
          $setup = Start-Process -FilePath (Join-Path $PWD 'dist\setup_POS_nuvi.exe') `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -PassThru
          if (!$setup.WaitForExit(30000)) {
            Stop-Process -Id $setup.Id -Force
            throw 'El instalador no terminó la comprobación en 30 segundos.'
          }
          if ($setup.ExitCode -eq 0) { throw 'El instalador aceptó un equipo sin XAMPP.' }
          if (Test-Path 'C:\xampp') { throw 'El instalador creó archivos antes de validar XAMPP.' }
      - name: Test existing installation protection
        shell: pwsh
        run: |
          if (Test-Path 'C:\xampp') {
            throw 'El runner ya contiene C:\xampp; la prueba no modificará una instalación existente.'
          }
          New-Item -ItemType Directory -Force 'C:\xampp\php', 'C:\xampp\mysql\bin', 'C:\xampp\htdocs\tienda-nuvi' | Out-Null
          New-Item -ItemType File 'C:\xampp\php\php.exe', 'C:\xampp\mysql\bin\mysql.exe' | Out-Null
          Set-Content 'C:\xampp\htdocs\tienda-nuvi\no-sobrescribir.txt' 'dato de prueba'
          $setup = Start-Process -FilePath (Join-Path $PWD 'dist\setup_POS_nuvi.exe') `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -PassThru
          if (!$setup.WaitForExit(30000)) {
            Stop-Process -Id $setup.Id -Force
            throw 'El instalador no terminó la comprobación en 30 segundos.'
          }
          if ($setup.ExitCode -eq 0) { throw 'El instalador aceptó una carpeta con archivos.' }
          if ((Get-Content 'C:\xampp\htdocs\tienda-nuvi\no-sobrescribir.txt' -Raw).Trim() -ne 'dato de prueba') {
            throw 'El instalador modificó el archivo existente.'
          }
          if ((Get-ChildItem 'C:\xampp\htdocs\tienda-nuvi' -Force).Count -ne 1) {
            throw 'El instalador copió archivos sobre la carpeta existente.'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: setup_POS_nuvi
          path: dist/setup_POS_nuvi.exe
      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/setup_POS_nuvi.exe