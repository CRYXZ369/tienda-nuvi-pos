<!doctype html>
<html lang="es-MX">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f766e">
    <title>Sin conexión · Miscelánea Nuvi</title>
    <style>
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: linear-gradient(145deg,#0f172a,#115e59); color: #f8fafc; font: 16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
        main { width: min(100%,430px); padding: 30px 26px; text-align: center; background: rgba(15,23,42,.74); border: 1px solid rgba(255,255,255,.2); border-radius: 22px; box-shadow: 0 20px 50px rgba(0,0,0,.28); }
        img { width: 78px; height: 78px; margin-bottom: 12px; border-radius: 18px; }
        h1 { margin: 0 0 10px; font-size: 1.45rem; } p { margin: 0 0 20px; color: #dbeafe; }
        button { width: 100%; min-height: 46px; border: 0; border-radius: 12px; background: #2dd4bf; color: #042f2e; font: inherit; font-weight: 800; cursor: pointer; }
    </style>
</head>
<body>
    <main>
        <img src="assets/nuvi-pwa-192.png" alt="Nuvi">
        <h1>Nuvi necesita conexión</h1>
        <p>Para proteger inventario, cuentas fiadas y ventas, la caja sólo opera conectada al servidor.</p>
        <button type="button" onclick="location.reload()">Reintentar conexión</button>
    </main>
</body>
</html>
